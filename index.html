    <script>
      // Ensure window.fetch has a setter so browser extensions and network interceptors can reassign fetch without throwing
      (function() {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already configured
        }
      })();
    </script>
